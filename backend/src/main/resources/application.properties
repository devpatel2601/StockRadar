spring.application.name=invest-research
server.port=8080

# ══════════════════════════════════════════════════════════════════════════════
# AI PROVIDER — change this block to switch providers (also swap dependency in pom.xml)
# ══════════════════════════════════════════════════════════════════════════════

# ── ✅ ACTIVE: Groq (free tier) ───────────────────────────────────────────────
# Get key at https://console.groq.com — no credit card needed
spring.ai.openai.api-key=${GROQ_API_KEY:placeholder}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile
spring.ai.openai.embedding.enabled=false

# ── ALTERNATIVE: Google Gemini ────────────────────────────────────────────────
# Get key at https://aistudio.google.com/apikey
# spring.ai.openai.api-key=${GEMINI_API_KEY:placeholder}
# spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
# spring.ai.openai.chat.options.model=gemini-2.0-flash
# spring.ai.openai.embedding.enabled=false

# ══════════════════════════════════════════════════════════════════════════════

# ── Search Provider ────────────────────────────────────────────────────────────
# Options: mock | tavily | brave
search.provider=tavily
search.max-results=3
search.tavily.api-key=${TAVILY_API_KEY:}
search.brave.api-key=${BRAVE_API_KEY:}

# ── Logging ────────────────────────────────────────────────────────────────────
logging.level.com.investresearch=DEBUG
logging.level.org.springframework.ai=INFO

# ── Firebase ──────────────────────────────────────────────────────────────────
firebase.service-account-path=./firebase-service-account.json

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info

# ── Swagger / OpenAPI ─────────────────────────────────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ══════════════════════════════════════════════════════════════════════════════
# DATABASE
# ══════════════════════════════════════════════════════════════════════════════

# ── ✅ ACTIVE: H2 file-based (no install needed — data persists in ./data/) ───
spring.datasource.url=jdbc:h2:file:./data/investdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── ALTERNATIVE: PostgreSQL ───────────────────────────────────────────────────
# spring.datasource.url=jdbc:postgresql://localhost:5432/investresearch
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=${DB_USERNAME:postgres}
# spring.datasource.password=${DB_PASSWORD:}
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# spring.h2.console.enabled=false

# ── JPA common settings ───────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
